<!DOCTYPE html>
<html>

<head>
  <title>
    Papa Ishy's Crepes - Menu
  </title>
  <link rel="icon"
      type="image/x-icon"
      href="/attached_assets/crepelogo.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta property="og:title" content="Papa Ishy's Crepes - menu" />
  <meta property="og:description" content="Crepes you'd die for." />
  <meta property="og:image" content="/attached_assets/crepelogo.png" />
  <meta property="og:url" content="https://papaishyscrepes.com/menu" />
  <style>
  @font-face {
    font-family: ishycrepe;
    src: url("/attached_assets/Bigcurls_1758695903562.ttf");
  }

  :root {
    --vh: 1vh;
  }
  
  html {
    overflow: hidden;
    height: 100%;
  }
  
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    height: calc(var(--vh, 1vh) * 100);
    background-color: #0d0d0d;
    position: relative;
    overflow: hidden;
  }

  @media (min-width: 768px), (hover: hover) and (pointer: fine) {
    body {
      background-image: url('/attached_assets/tablet.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  }

  @media (hover: none) and (pointer: coarse) and (max-width: 767px),
         (hover: none) and (pointer: coarse) and (max-height: 480px) {
    body {
      background-image: url('/attached_assets/phone.jpeg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }
  }

  .loading-screen {
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .loading-dots {
    display: flex;
    gap: 10px;
  }

  .dot {
    width: 12px;
    height: 12px;
    background-color: #ffffff;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .dot:nth-child(1) {
    animation-delay: -0.32s;
  }

  .dot:nth-child(2) {
    animation-delay: -0.16s;
  }

  @keyframes bounce {
    0%, 80%, 100% {
      transform: scale(0);
    }
    40% {
      transform: scale(1);
    }
  }

  .page-content {
    display: none;
    height: 100vh;
    height: calc(var(--vh, 1vh) * 100);
    position: relative;
    z-index: 2;
  }

  .page-content.show {
    display: flex !important;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    padding: 20px 0;
  }

  .menu-container {
    width: 90vw;
    max-width: 800px;
    height: 80vh;
    height: calc(var(--vh, 1vh) * 80);
    border: 2px solid #fff;
    border-radius: 8px;
    overflow: hidden;
    background-color: #ffffff;
    background-image: url('/attached_assets/ishyscrepesmenu.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    flex-shrink: 0;
  }

  @media (hover: none) and (pointer: coarse) and (max-width: 767px),
         (hover: none) and (pointer: coarse) and (max-height: 480px) {
    .menu-container {
      width: 95vw;
      max-width: none;
      height: 70vh;
      height: calc(var(--vh, 1vh) * 70);
      border-radius: 4px;
    }

    #fullscreenLink {
      font-size: 12px;
    }
  }

  .hidden {
    display: none;
  }

  .show {
    display: block !important;
  }

  .petals-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .petal {
    position: absolute;
    background-color: rgba(255, 182, 193, 0.8);
    border-radius: 50% 0 50% 0;
    animation: fall linear 1;
    transform-origin: center;
  }

  .petal::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 105, 180, 0.6);
    border-radius: 0 50% 0 50%;
    transform: rotate(45deg);
  }

  @keyframes fall {
    0% {
      transform: translateY(-100vh) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(360deg);
      opacity: 0;
    }
  }

  .petal:nth-child(odd) {
    background-color: rgba(255, 192, 203, 0.7);
  }

  .petal:nth-child(even) {
    background-color: rgba(255, 20, 147, 0.5);
  }

  .petal:nth-child(3n) {
    background-color: rgba(255, 160, 122, 0.6);
  }

  .petal-wrapper {
    animation: sway linear infinite;
  }

  @keyframes sway {
    0% { transform: translateX(0px); }
    25% { transform: translateX(10px); }
    50% { transform: translateX(0px); }
    75% { transform: translateX(-10px); }
    100% { transform: translateX(0px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .petal, .petal-wrapper {
      animation: none;
    }
    .petals-container {
      display: none;
    }
  }

  .magnifying-glass {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 255, 255, 0.3);
    background-image: url('/attached_assets/ishyscrepesmenu.png');
    background-repeat: no-repeat;
    pointer-events: none;
    z-index: 1000;
    display: none;
    transform: translate(-50%, -110%);
  }

  .toolstext {
    font-family: ishycrepe;
    color: white;
    text-align: center;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    z-index: 3;
    margin: 8px 0;
  }
  
  #fullscreenLink {
    white-space: nowrap;
    font-size: 14px;
    margin-top: -8px;
  }
  
  #fullscreenLink .toolslink {
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 1.0), 4px 4px 12px rgba(0, 0, 0, 0.95);
    font-family: Arial, Helvetica, sans-serif;
  }

  .toolslink {
    text-decoration: underline;
    color: #fff;
    opacity: 0.85;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 1.0), 4px 4px 12px rgba(0, 0, 0, 0.95);
    font-family: ishycrepe;
  }

  .toolslink:hover {
    opacity: 0.6;
  }

  .examples-dropdown-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin-top: 10px;
  }

  .examples-button {
    background-image: url('/attached_assets/button.jpeg');
    background-size: cover;
    background-position: center;
    border: 2px solid black;
    color: #2C1810;
    width: 250px;
    max-width: 90%;
    padding: 12px 24px;
    text-align: center;
    text-decoration: none;
    display: block;
    font-size: 16px;
    cursor: pointer;
    font-family: ishycrepe;
    text-shadow: none;
    clip-path: polygon(0% 15%, 15% 0%, 25% 5%, 35% 2%, 45% 8%, 55% 1%, 65% 4%, 75% 7%, 85% 3%, 95% 6%, 100% 12%, 98% 25%, 100% 35%, 95% 48%, 98% 60%, 93% 75%, 97% 85%, 100% 95%, 85% 97%, 75% 93%, 65% 96%, 55% 99%, 45% 92%, 35% 98%, 25% 95%, 15% 100%, 5% 97%, 0% 85%, 2% 75%, 0% 60%, 5% 48%, 0% 35%, 2% 25%);
    -webkit-transform: perspective(1px) translateZ(0);
    transform: perspective(1px) translateZ(0);
    box-shadow: 0 0 1px rgba(0, 0, 0, 0);
    -webkit-transition: transform 0.3s ease-in-out;
    transition: transform 0.3s ease-in-out;
  }

  .examples-button:hover {
    -webkit-transform: scale(0.95);
    transform: scale(0.95);
  }

  .examples-button:active {
    -webkit-transform: scale(0.85);
    transform: scale(0.85);
    transition: transform 0.1s ease-in-out;
  }

  .examples-dropdown {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(210, 180, 140, 0.95);
    min-width: 280px;
    max-width: 90vw;
    max-height: 400px;
    overflow-y: auto;
    overflow-x: hidden;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
    z-index: 1000;
    border-radius: 8px;
    border: 2px solid #2C1810;
    margin-bottom: 5px;
    padding: 10px;
  }

  .examples-dropdown.show {
    display: block;
    animation: fadeIn 0.3s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .example-image {
    width: 100%;
    height: auto;
    border-radius: 8px;
    border: 2px solid #fff;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    margin-bottom: 10px;
  }

  .example-image:last-child {
    margin-bottom: 0;
  }
  </style>
</head>

<body>
  <div class="petals-container" id="petals-container"></div>
  <div id="loading" class="loading-screen" style="position: fixed; z-index: 10;">
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  
  <div id="content" class="page-content">
    <div class="menu-container">
      <img id="menuImage" src="/attached_assets/ishyscrepesmenu.png" alt="Papa Ishy's Crepes Menu" style="width: 100%; height: 100%; opacity: 0; position: absolute;">
    </div>
    
    <p class="toolstext" id="fullscreenLink"><a class="toolslink" href="/attached_assets/ishyscrepesmenu.pdf" target="_blank">view in full screen (better quality)</a></p>
    
    <div class="examples-dropdown-container">
      <div class="examples-button" id="examplesBtn">
        What you're getting
      </div>
      <div class="examples-dropdown" id="examplesDropdown">
        <img src="/attached_assets/examples/caramel.jpeg" alt="Caramel Crepe Example" class="example-image">
        <img src="/attached_assets/examples/strawberry.jpeg" alt="Strawberry Crepe Example" class="example-image">
        <img src="/attached_assets/examples/lemon.jpeg" alt="Lemon Crepe Example" class="example-image">
        <img src="/attached_assets/examples/savory.jpeg" alt="Savory Crepe Example" class="example-image">
      </div>
    </div>
    
    <p class="toolstext" id="backLink"><a class="toolslink" href="/">Main Menu</a></p>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('content').classList.add('show');
    }, 3000);

    let petalInterval = null;

    function createPetal() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'petal-wrapper';
      wrapper.style.position = 'absolute';
      wrapper.style.top = '-50px';
      
      const petal = document.createElement('div');
      petal.className = 'petal';
      
      const size = Math.random() * 12 + 8;
      petal.style.width = size + 'px';
      petal.style.height = size + 'px';
      
      const startX = Math.random() * 100;
      wrapper.style.left = startX + '%';
      
      const fallDuration = Math.random() * 5 + 3;
      const swayDuration = Math.random() * 3 + 2;
      
      petal.style.animationDuration = fallDuration + 's';
      wrapper.style.animationDuration = swayDuration + 's';
      
      const delay = Math.random() * 2;
      petal.style.animationDelay = delay + 's';
      wrapper.style.animationDelay = delay + 's';
      
      wrapper.appendChild(petal);
      document.getElementById('petals-container').appendChild(wrapper);
      
      setTimeout(() => {
        if (wrapper.parentNode) {
          wrapper.parentNode.removeChild(wrapper);
        }
      }, (fallDuration + delay) * 1000);
    }

    function startPetals() {
      if (petalInterval) return;
      petalInterval = setInterval(createPetal, 300);
    }

    function stopPetals() {
      if (petalInterval) {
        clearInterval(petalInterval);
        petalInterval = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPetals();
      } else {
        startPetals();
      }
    });

    startPetals();
    
    let magnifyingGlass = null;
    let menuImageContainer = null;
    
    function createMagnifyingGlass() {
      magnifyingGlass = document.createElement('div');
      magnifyingGlass.className = 'magnifying-glass';
      document.body.appendChild(magnifyingGlass);
    }
    
    function updateMagnifyingGlass(e) {
      if (!magnifyingGlass || !menuImageContainer) return;
      
      const rect = menuImageContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const glassX = e.clientX;
      const glassY = e.clientY;
      
      magnifyingGlass.style.left = glassX + 'px';
      magnifyingGlass.style.top = glassY + 'px';
      magnifyingGlass.style.display = 'block';
      
      const glassHeight = 200;
      const topPosition = glassY - (glassHeight * 1.1);
      
      if (topPosition < 0) {
        magnifyingGlass.style.transform = 'translate(-50%, 10%)';
      } else {
        magnifyingGlass.style.transform = 'translate(-50%, -110%)';
      }
      
      const containerWidth = menuImageContainer.offsetWidth;
      const containerHeight = menuImageContainer.offsetHeight;
      const zoomFactor = 2.5;
      
      const tempImg = new Image();
      tempImg.src = '/attached_assets/ishyscrepesmenu.png';
      
      tempImg.onload = function() {
        const imgNaturalWidth = tempImg.naturalWidth;
        const imgNaturalHeight = tempImg.naturalHeight;
        
        const containerAspect = containerWidth / containerHeight;
        const imageAspect = imgNaturalWidth / imgNaturalHeight;
        
        let renderedWidth, renderedHeight, offsetX, offsetY;
        
        if (containerAspect > imageAspect) {
          renderedWidth = containerWidth;
          renderedHeight = containerWidth / imageAspect;
          offsetX = 0;
          offsetY = (renderedHeight - containerHeight) / 2;
        } else {
          renderedWidth = containerHeight * imageAspect;
          renderedHeight = containerHeight;
          offsetX = (renderedWidth - containerWidth) / 2;
          offsetY = 0;
        }
        
        const adjustedX = x + offsetX;
        const adjustedY = y + offsetY;
        
        magnifyingGlass.style.backgroundSize = (renderedWidth * zoomFactor) + 'px ' + (renderedHeight * zoomFactor) + 'px';
        
        const bgX = (adjustedX * zoomFactor) - 100;
        const bgY = (adjustedY * zoomFactor) - 100;
        
        magnifyingGlass.style.backgroundPosition = `-${bgX}px -${bgY}px`;
      };
      
      if (tempImg.complete) {
        tempImg.onload();
      }
    }
    
    function hideMagnifyingGlass() {
      if (magnifyingGlass) {
        magnifyingGlass.style.display = 'none';
      }
    }
    
    setTimeout(() => {
      menuImageContainer = document.querySelector('.menu-container');
      if (!menuImageContainer) return;
      
      createMagnifyingGlass();
      
      menuImageContainer.addEventListener('mousemove', updateMagnifyingGlass);
      menuImageContainer.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        updateMagnifyingGlass(touch);
      }, { passive: true });
      
      menuImageContainer.addEventListener('mouseleave', hideMagnifyingGlass);
      menuImageContainer.addEventListener('touchend', hideMagnifyingGlass);
      menuImageContainer.addEventListener('touchcancel', hideMagnifyingGlass);
      
      menuImageContainer.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        updateMagnifyingGlass(touch);
      }, { passive: true });
    }, 3100);
    
    document.getElementById('examplesBtn').addEventListener('click', function(e) {
      e.preventDefault();
      const dropdown = document.getElementById('examplesDropdown');
      dropdown.classList.toggle('show');
    });

    document.addEventListener('click', function(e) {
      const examplesContainer = document.querySelector('.examples-dropdown-container');
      const dropdown = document.getElementById('examplesDropdown');
      
      if (!examplesContainer.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });
    
    function setVh() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    
    setVh();
    
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(setVh, 100);
    });
    
    window.addEventListener('orientationchange', () => {
      setTimeout(setVh, 100);
    });

  </script>
</body>

</html>
