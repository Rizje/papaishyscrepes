/* Falling Petals Animation */
.petals-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

.petal {
  position: absolute;
  background-color: rgba(255, 182, 193, 0.8);
  border-radius: 50% 0 50% 0;
  animation: fall linear 1;
  transform-origin: center;
}

.petal::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 100%;
  height: 100%;
  background-color: rgba(255, 105, 180, 0.6);
  border-radius: 0 50% 0 50%;
  transform: rotate(45deg);
}

@keyframes fall {
  0% {
    transform: translateY(-100vh) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

.petal:nth-child(odd) {
  background-color: rgba(255, 192, 203, 0.7);
}

.petal:nth-child(even) {
  background-color: rgba(255, 20, 147, 0.5);
}

.petal:nth-child(3n) {
  background-color: rgba(255, 160, 122, 0.6);
}

.petal-wrapper {
  animation: sway linear infinite;
}

@keyframes sway {
  0% { transform: translateX(0px); }
  25% { transform: translateX(10px); }
  50% { transform: translateX(0px); }
  75% { transform: translateX(-10px); }
  100% { transform: translateX(0px); }
}

/* Pause animations for users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
  .petal, .petal-wrapper {
    animation: none;
  }
  .petals-container {
    display: none;
  }
}

<script>
// Direct execution - DOM should be ready since script is at bottom
// Show loading screen for 1 second, then show the main content
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById("maincontainer").style.display = "block";
}, 1000);

document.getElementById("toolslink").href = "/menu?csrf=" + generateCsrf(12)
document.getElementById("howtoolslink").href = "/how-to-order?csrf=" + generateCsrf(12)

function generateCsrf(length) {
   var result           = '';
   var characters       = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
   var charactersLength = characters.length;
   for ( var i = 0; i < length; i++ ) {
      result += characters.charAt(Math.floor(Math.random() * charactersLength));
   }
   return result;
}

// Special Offers Dropdown functionality
document.getElementById('specialOffersBtn').addEventListener('click', function(e) {
  e.preventDefault();
  const dropdown = document.getElementById('dropdownContent');
  dropdown.classList.toggle('show');
});

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
  const specialOffersContainer = document.querySelector('.special-offers-container');
  const dropdown = document.getElementById('dropdownContent');
  
  if (!specialOffersContainer.contains(e.target)) {
    dropdown.classList.remove('show');
  }
});

// Global interval management
let petalInterval = null;

// Falling Petals Animation
function createPetal() {
  // Check if user prefers reduced motion
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  const wrapper = document.createElement('div');
    wrapper.className = 'petal-wrapper';
    wrapper.style.position = 'absolute';
    wrapper.style.top = '-50px';
    
    const petal = document.createElement('div');
    petal.className = 'petal';
    
    // Random size between 8px and 20px
    const size = Math.random() * 12 + 8;
    petal.style.width = size + 'px';
    petal.style.height = size + 'px';
    
    // Random horizontal position
    const startX = Math.random() * 100;
    wrapper.style.left = startX + '%';
    
    // Random animation durations
    const fallDuration = Math.random() * 5 + 3;
    const swayDuration = Math.random() * 3 + 2;
    
    petal.style.animationDuration = fallDuration + 's';
    wrapper.style.animationDuration = swayDuration + 's';
    
    // Random delays
    const delay = Math.random() * 2;
    petal.style.animationDelay = delay + 's';
    wrapper.style.animationDelay = delay + 's';
    
    wrapper.appendChild(petal);
    document.getElementById('petals-container').appendChild(wrapper);
    
    // Remove petal after animation completes
    setTimeout(() => {
      if (wrapper.parentNode) {
        wrapper.parentNode.removeChild(wrapper);
      }
    }, (fallDuration + delay) * 1000);
  }

  // Create petals continuously
  function startPetals() {
    if (petalInterval) return; // Prevent multiple intervals
    petalInterval = setInterval(createPetal, 300);
  }

  function stopPetals() {
    if (petalInterval) {
      clearInterval(petalInterval);
      petalInterval = null;
    }
  }

  // Handle visibility change (single listener)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopPetals();
    } else {
      startPetals();
    }
  });

// Start the petals animation
startPetals();

// Safari mobile VH fix
function setVh() {
    const vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', `${vh}px`);
  }

// Initial call
setVh();

// Update on resize (with debounce)
let resizeTimeout;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(setVh, 100);
  });

// Update on orientation change
window.addEventListener('orientationchange', () => {
    setTimeout(setVh, 100);
  });

</script>
